# ChatHelper reverse proxy for the server hostname srv.tallweb.eu on a
# DirectAdmin/Apache host. Installed as /etc/httpd/conf/extra/chathelper.conf
# and pulled in by one line in conf/extra/httpd-includes.conf (DirectAdmin's
# custom hook, never overwritten by its config rewrites):
#     Include conf/extra/chathelper.conf
# Both vhosts are defined before DirectAdmin's own "localhost" defaults, so
# they also become the default site for this IP. Adjust IP, hostname and the
# certificate paths for another server.

<VirtualHost 185.69.149.245:80>
    ServerName srv.tallweb.eu
    DocumentRoot /var/www/html
    # Let's Encrypt HTTP-01 challenges for the hostname certificate must keep
    # working on port 80; everything else is sent to HTTPS.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://srv.tallweb.eu%{REQUEST_URI} [R=301,L]
    CustomLog /var/log/httpd/chathelper_access_log combined
    ErrorLog /var/log/httpd/chathelper_error_log
</VirtualHost>

<VirtualHost 185.69.149.245:443>
    ServerName srv.tallweb.eu
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile /etc/httpd/conf/ssl.crt/server.crt.combined
    SSLCertificateKeyFile /etc/httpd/conf/ssl.key/server.key
    Protocols h2 http/1.1

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 180
    RequestHeader set X-Forwarded-Proto "https"
    # ACME challenges come from disk; everything else goes to Uvicorn.
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:8000/ retry=0 connectiontimeout=5 timeout=180
    ProxyPassReverse / http://127.0.0.1:8000/

    # The chat reply is a text/event-stream; the global DEFLATE filter would
    # buffer it, so compression is disabled for that path.
    SetEnvIf Request_URI "^/chat" no-gzip dont-vary
    LimitRequestBody 1048576

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000"

    CustomLog /var/log/httpd/chathelper_access_log combined
    ErrorLog /var/log/httpd/chathelper_error_log
</VirtualHost>
